server:
  address: ":8000"
  dumpRouterMap: true
  routeOverWrite: true
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

logger:
  level: "info"
  stdout: true

auth:
  issuer: "itcodex"
  accessTTL: "15m"
  refreshTTL: "168h"
  # JWT 密钥不写入配置库；通过 ITCODEX_JWT_SECRET 注入（至少 32 字节）。
  jwtSecret: ""

database:
  logger:
    level: "all"
    stdout: true
  default:
    type: "mysql"
    link: "mysql:root:123456@tcp(127.0.0.1:3306)/itcodex?loc=Local&parseTime=true&charset=utf8mb4"
    debug: true
    createdAt: "created_at"
    updatedAt: "updated_at"

metadata:
  dsn: "root:123456@tcp(127.0.0.1:3306)/itcodex?parseTime=true&loc=Local&charset=utf8mb4"
  tablePrefix: "c_"
  autoSync: true
  scriptsPath: "./manifest/scripts"
  scriptTimeout: 5000
  defaultPrimaryKey: "snowflake"
  allowTruncate: false
  logging: true
  encryptKey: "itcodex-default-encrypt-key"
  storagePath: "./manifest/storage"
